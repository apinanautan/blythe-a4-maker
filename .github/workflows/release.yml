name: Release EXE

# Builds BlytheEyeMaker.exe on Windows and publishes a GitHub Release whenever
# APP_VERSION on main changes to a version that has no release yet. The in-app
# updater downloads the EXE and asset zip from the latest release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      created: ${{ steps.version.outputs.exists == 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path "app\blythe_a4_maker.pyw" -Pattern '^APP_VERSION = "([^"]+)"' | Select-Object -First 1
          $tag = "v" + $match.Matches[0].Groups[1].Value
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $exists = if ($LASTEXITCODE -eq 0) { "true" } else { "false" }
          "exists=$exists" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version $tag, release exists: $exists"
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-python@v5
        if: steps.version.outputs.exists == 'false'
        with:
          python-version: "3.12"

      - name: Install build dependencies
        if: steps.version.outputs.exists == 'false'
        run: python -m pip install -r app/requirements.txt pyinstaller

      - name: Build EXE
        id: build
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: ./build_release.ps1

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: |
          $dir = "${{ steps.build.outputs.release_dir }}"
          gh release create "${{ steps.version.outputs.tag }}" `
            (Join-Path $dir "BlytheEyeMaker.exe") `
            (Join-Path $dir "BlytheEyeMakerAssets.zip") `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Blythe Eye Maker ${{ steps.version.outputs.tag }}" `
            --generate-notes `
            --latest
        env:
          GH_TOKEN: ${{ github.token }}

  ipa:
    # The iPhone app is attached to the same release as the EXE.
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build IPA
        run: bash ios/build_ipa.sh
      - name: Attach IPA to the release
        run: gh release upload "${{ needs.release.outputs.tag }}" ios/BlytheEyeMaker.ipa --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
