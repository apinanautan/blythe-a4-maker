name: Mobile library

# Turns the full eye library (data branch) into the small, ready-made chips the
# iPhone app downloads, published on the `mobile` branch. Runs when the desktop
# or the phone uploads (repository_dispatch), on app changes, and hourly as a
# safety net.
on:
  repository_dispatch:
    types: [library-updated]
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-library
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: src
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - name: Build library
        run: python src/tools/build_mobile_library.py data out
      - name: Publish to the mobile branch
        working-directory: out
        run: |
          git init -q -b mobile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Mobile library from data $(git -C ../data rev-parse --short HEAD)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mobile
